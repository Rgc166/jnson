name: Professor THC - Etapa 2
on:
  push:
    branches: [codex/teacher-thc-stage2]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  professor-thc:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Validate scripts and compile
        shell: pwsh
        run: |
          try {
            $PSNativeCommandUseErrorActionPreference=$false
            ./scripts/check-scripts.ps1
            $output=dotnet build VeyonSync.slnx -c Release -p:RestoreLockedMode=true -warnaserror 2>&1
            $code=$LASTEXITCODE
            $output | ForEach-Object { Write-Host $_ }
            if($code -ne 0){throw (($output | Where-Object {$_ -match 'error [A-Z0-9]+|: error'} | Select-Object -First 4) -join ' | ')}
            dotnet test tests/VeyonSync.Tests/VeyonSync.Tests.csproj -c Release --no-build --logger 'trx;LogFileName=thc-core.trx' --results-directory artifacts/test-results
            if($LASTEXITCODE -ne 0){
              [xml]$result=Get-Content artifacts/test-results/thc-core.trx
              $errors=$result.TestRun.Results.UnitTestResult | Where-Object outcome -eq Failed | ForEach-Object {$_.Output.ErrorInfo.Message}
              throw ('Tests failed: '+($errors -join ' | '))
            }
          } catch { Write-Output "::error::$($_.Exception.Message.Replace("`r",'').Replace("`n",'%0A'))"; throw }
      - name: Build the interface-only package
        shell: pwsh
        run: |
          try { ./scripts/build-thc.ps1 }
          catch { Write-Output "::error::$($_.Exception.Message.Replace("`r",'').Replace("`n",'%0A'))"; throw }
      - name: Verify add-on installer and WPF window
        shell: pwsh
        run: |
          try { ./scripts/windows-thc-smoke.ps1 }
          catch { Write-Output "::error::$($_.Exception.Message.Replace("`r",'').Replace("`n",'%0A'))"; throw }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: professor-thc-etapa2
          path: |
            artifacts/VeyonSync-Professor-THC-win-x64.zip
            artifacts/THC-SHA256SUMS.txt
